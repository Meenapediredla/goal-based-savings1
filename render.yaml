# Render Blueprint — matches existing service URL http://localhost:8080
services:
  - type: web
    name: goal-based-savings-backend
    runtime: docker
    dockerfilePath: ./server/demo/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_CORS_ORIGINS
        value: https://goal-based-savings.vercel.app,https://goal-based-savings-2npm57inq-goal-savings-meena.vercel.app,http://localhost:5173,*
      - key: PORT
        value: "8080"
