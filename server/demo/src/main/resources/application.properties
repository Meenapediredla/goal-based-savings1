# Database (required in production — set in Render/host env)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/goal_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=${PORT:8080}
server.error.include-message=always

# JWT (set JWT_SECRET in production)
jwt.secret=${JWT_SECRET:secure-and-constant-secret-signing-key-for-goal-based-savings-tracker-app-2026}

# CORS — comma-separated frontend URLs when API and UI are on different domains
# Example: https://my-app.onrender.com,https://my-app.vercel.app
app.cors.allowed-origins=${APP_CORS_ORIGINS:https://goal-based-savings.vercel.app,http://localhost:5173,http://localhost:3000,*}
